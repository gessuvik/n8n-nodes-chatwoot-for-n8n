# Publishes this n8n community node package to npm on every v*.*.* tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement using OIDC Trusted Publishing (no long-lived secrets).
#
# ─── ONE-TIME SETUP (already done) ────────────────────────────────────────────
#
# On npmjs.com: package settings → Trusted Publishers → Add a trusted publisher:
#   Repository owner: gessuvik
#   Repository name:  n8n-nodes-chatwoot-for-n8n
#   Workflow name:    publish.yml
#   Environment:      (leave blank)
#
# ─── RELEASE PROCESS ──────────────────────────────────────────────────────────
#
# Bump the version in package.json, commit, tag vX.Y.Z, and push:
#   npm version 0.3.1          # or edit package.json manually
#   git push --follow-tags
# Pushing the tag triggers this workflow, which lints, builds, and publishes.

name: Publish

on:
  push:
    tags:
      # Matches v0.1.0, v1.2.3, v2.0.0-rc.1, etc.
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Required for npm's OIDC (Trusted Publishing) flow.
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        # No package-lock.json is committed; legacy peer deps avoids the npm 10
        # "edgesOut" resolution bug with this dependency tree.
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
