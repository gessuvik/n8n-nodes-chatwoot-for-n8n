# Publishes this n8n community node package to npm on every v*.*.* tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement using OIDC Trusted Publishing (no long-lived secrets).
#
# ─── ONE-TIME SETUP (already done) ────────────────────────────────────────────
#
# On npmjs.com: package settings → Trusted Publishers → Add a trusted publisher:
#   Repository owner: gessuvik
#   Repository name:  n8n-nodes-chatwoot-for-n8n
#   Workflow name:    publish.yml
#   Environment:      (leave blank)
#
# ─── RELEASE PROCESS ──────────────────────────────────────────────────────────
#
# Bump the version in package.json, commit, tag vX.Y.Z, and push:
#   npm version 0.3.1          # or edit package.json manually
#   git push --follow-tags
# Pushing the tag triggers this workflow, which lints, builds, and publishes.

name: Publish

on:
  push:
    tags:
      # Matches v0.1.0, v1.2.3, v2.0.0-rc.1, etc.
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No registry-url here: for OIDC Trusted Publishing, setting it makes
          # setup-node write a placeholder _authToken that npm prefers over the
          # OIDC exchange (npm/cli#8730, actions/setup-node#1477).

      - name: Install dependencies
        # No package-lock.json is committed; legacy peer deps avoids the npm 10
        # "edgesOut" resolution bug with this dependency tree.
        run: npm install --legacy-peer-deps

      - name: Upgrade npm
        # OIDC trusted publishing (npm -> registry auth exchange) requires
        # npm >= 11.5.1. Node 22 bundles npm 10.x, which signs provenance but
        # cannot do the OIDC auth exchange, surfacing as a misleading 404.
        run: npm install -g npm@latest

      - name: Release
        # n8n-node release detects CI (GITHUB_ACTIONS) and runs lint + build,
        # then `npm publish` with RELEASE_MODE + NPM_CONFIG_PROVENANCE set.
        # RELEASE_MODE is also what satisfies the `prepublishOnly` gate.
        run: npm run release
